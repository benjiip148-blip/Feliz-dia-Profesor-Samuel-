<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feliz Día del Profesor</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root { --a:#ff7eb3; --b:#ff758c; --c:#7c4dff; --d:#ffd166; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: 'Poppins', sans-serif; color: #fff; overflow-x: hidden;
    background: linear-gradient(135deg, #3a1c71, #d76d77, #ffaf7b);
    background-size: 300% 300%; animation: bg 14s ease infinite;
  }
  @keyframes bg { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

  .floaters { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .floaters span { position: absolute; bottom: -60px; opacity: .0; animation: float linear infinite; }
  @keyframes float {
    0% { transform: translateY(0) rotate(0); opacity: 0; }
    10% { opacity: .85; }
    100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
  }

  .card {
    position: relative; z-index: 1; width: min(92vw, 560px); margin: 24px;
    padding: 40px 28px; text-align: center; border-radius: 28px;
    background: rgba(255,255,255,.14); backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.35); box-shadow: 0 20px 60px rgba(0,0,0,.3);
    animation: pop .9s cubic-bezier(.2,1.3,.4,1) both;
  }
  @keyframes pop { from { transform: scale(.7) translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }

  .emoji { font-size: 3.4rem; display: inline-block; animation: bounce 2s ease-in-out infinite; }
  @keyframes bounce { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-14px) rotate(6deg); } }

  h1 { font-family: 'Playfair Display', serif; font-size: clamp(1.9rem, 6vw, 2.8rem); margin: 10px 0 6px; line-height: 1.15; }
  h1 em { color: var(--d); }
  .sub { font-weight: 300; opacity: .9; margin-bottom: 22px; }

  #gift { cursor: pointer; font-size: 5rem; animation: shake 1.6s ease-in-out infinite; user-select: none; }
  @keyframes shake { 0%,100% { transform: rotate(0); } 10%,30% { transform: rotate(-10deg); } 20%,40% { transform: rotate(10deg); } 50% { transform: rotate(0); } }
  .hint { font-size: .9rem; opacity: .85; margin-top: 6px; }

  #reveal { display: none; }
  #reveal.show { display: block; animation: pop .8s ease both; }

  .gif-box { margin: 18px auto; width: min(100%, 320px); border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.35); border: 3px solid rgba(255,255,255,.6); }
  .gif-box img { width: 100%; display: block; }
  .gif-fallback { display: none; font-size: 5rem; padding: 30px; animation: bounce 1.5s infinite; }

  #msg { font-size: 1.02rem; line-height: 1.7; min-height: 120px; text-align: left; margin: 14px 0; font-weight: 300; white-space: pre-line; }
  .cursor::after { content: '|'; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .sign { font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.25rem; line-height: 1.5; white-space: pre-line; color: var(--d); opacity: 0; transition: opacity 1.5s; }
  .sign.show { opacity: 1; }

  button {
    margin-top: 18px; padding: 12px 26px; border: 0; border-radius: 999px; cursor: pointer;
    font: 600 1rem 'Poppins', sans-serif; color: #3a1c71; background: var(--d);
    box-shadow: 0 6px 18px rgba(0,0,0,.25); transition: transform .2s;
  }
  button:hover { transform: scale(1.07); }
  canvas { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
</style>
</head>
<body>

<div class="floaters" id="floaters"></div>
<canvas id="confetti"></canvas>

<main class="card">
  <div class="emoji">🍎</div>
  <h1>¡Feliz Día del <em>Profesor</em>!</h1>
  <p class="sub">Para <b id="teacher"></b></p>

  <div id="giftWrap">
    <div id="gift" title="Ábrelo">🎁</div>
    <p class="hint">Toca el regalo para abrirlo</p>
  </div>

  <div id="reveal">
    <div class="gif-box">
      <img id="gif" alt="Gracias profe" src="">
      <div class="gif-fallback" id="fallback">🎉👏🥳</div>
    </div>
    <p id="msg" class="cursor"></p>
    <p class="sign" id="sign"></p>
    <button id="again">🎊 Más confeti</button>
  </div>
</main>

<script>
/* ========= PERSONALIZA AQUÍ ========= */
const TEACHER = "Profe Samuel";           // nombre del profesor/a
const FROM    = "Con cariño,\n8vo B “Prieto”"; // tu firma
const GIF_URL = "https://media.giphy.com/media/g9582DNuQppxC/giphy.gif"; // pega aquí el link de tu GIF
const MESSAGE =
`Profe, aunque ya no esté en el colegio, queríamos que supiera que seguimos acordándonos de usted.

Para todo el curso fue alguien muy importante. No solo nos enseñó materias: nos enseñó a esforzarnos, a confiar en nosotros y a no rendirnos cuando algo se ponía difícil.

Gracias por su paciencia, por sus consejos, por las risas en clases y por esos días en que sin darse cuenta nos alegraba la jornada completa.

Fue de esos profesores que uno no olvida, de los que dejan huella en cada uno de sus alumnos y en el curso entero. Se le echa de menos, y mucho.

Esperamos que esté muy bien, que le vaya increíble en todo lo que haga, y que sepa que en 8vo B siempre tendrá un lugar en nuestros corazones.

¡Feliz Día del Profesor! 💜`;
/* ===================================== */

document.getElementById('teacher').textContent = TEACHER;
document.getElementById('sign').textContent = FROM;

/* Elementos flotantes */
const icons = ['💜','⭐','🌸','✨','📚','🍎','💛','🎈'];
const fl = document.getElementById('floaters');
for (let i = 0; i < 28; i++) {
  const s = document.createElement('span');
  s.textContent = icons[Math.floor(Math.random() * icons.length)];
  s.style.left = Math.random() * 100 + 'vw';
  s.style.fontSize = (16 + Math.random() * 26) + 'px';
  s.style.animationDuration = (8 + Math.random() * 10) + 's';
  s.style.animationDelay = (Math.random() * 10) + 's';
  fl.appendChild(s);
}

/* Confeti */
const cv = document.getElementById('confetti'), ctx = cv.getContext('2d');
let parts = [], running = false;
function resize() { cv.width = innerWidth; cv.height = innerHeight; }
resize(); addEventListener('resize', resize);
function burst() {
  const colors = ['#ff7eb3','#ffd166','#7c4dff','#06d6a0','#4cc9f0','#ffffff'];
  for (let i = 0; i < 160; i++) {
    parts.push({
      x: cv.width / 2, y: cv.height / 2.2,
      vx: (Math.random() - .5) * 16, vy: Math.random() * -15 - 3,
      g: .28, s: 5 + Math.random() * 7, r: Math.random() * 6,
      vr: (Math.random() - .5) * .4, c: colors[Math.floor(Math.random() * colors.length)], life: 160
    });
  }
  if (!running) { running = true; loop(); }
}
function loop() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  parts.forEach(p => {
    p.vy += p.g; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life--;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
    ctx.globalAlpha = Math.max(p.life / 160, 0);
    ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6);
    ctx.restore();
  });
  parts = parts.filter(p => p.life > 0 && p.y < cv.height + 40);
  if (parts.length) requestAnimationFrame(loop); else { running = false; ctx.clearRect(0, 0, cv.width, cv.height); }
}

/* Abrir regalo */
function typeText(el, text, done) {
  let i = 0;
  (function tick() {
    el.textContent = text.slice(0, i++);
    if (i <= text.length) setTimeout(tick, 38); else { el.classList.remove('cursor'); done && done(); }
  })();
}
document.getElementById('gift').addEventListener('click', () => {
  document.getElementById('giftWrap').style.display = 'none';
  document.getElementById('reveal').classList.add('show');
  const img = document.getElementById('gif');
  img.onerror = () => { img.style.display = 'none'; document.getElementById('fallback').style.display = 'block'; };
  img.src = GIF_URL;
  burst();
  typeText(document.getElementById('msg'), MESSAGE, () => {
    document.getElementById('sign').classList.add('show');
    burst();
  });
});
document.getElementById('again').addEventListener('click', burst);
</script>
</body>
</html>
